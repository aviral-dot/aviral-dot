name: Generate Animated Core Focus

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install animation dependencies
        run: |
          pip install matplotlib pillow

      - name: Generate animation
        run: |
          python scripts/generate_core_focus.py

      - name: Commit animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/core-focus.gif

          git diff --cached --quiet || git commit -m "Add animated core focus"

          git push
